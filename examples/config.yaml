# Merge into an existing host configuration. Do not replace its credentials.
plugins:
  enabled: true
  dir: ./plugins
  configs:
    github-copilot:
      enabled: true
      model_prefix: copilot # Blank also uses copilot; trailing slashes are normalized.
      models: [] # Optional allowlist of {name, alias?}; empty discovers all eligible models.
      # models:
      #   - name: gpt-6-sol # Exposed as copilot/gpt-6-sol, if eligible.
      #   - name: gpt-6-sol
      #     alias: coding # Explicit aliases replace the entire prefixed ID.
      models_excluded: [] # Example: ["claude-"] when native Claude owns these IDs.
      github_client_id: Iv1.b507a08c87ecfe98 # Public device-flow client ID, not a secret.
      github_scope: read:user
      github_base_url: https://github.com
      github_api_url: https://api.github.com
      copilot_api_url: https://api.githubcopilot.com
      allow_insecure_base_urls: false # Explicit test-only loopback endpoints; allows HTTP.
      allow_custom_endpoints: false # Trust other non-GHE HTTPS endpoints with credentials/prompts.
      allow_custom_scopes: false # Explicitly opt in before requesting scopes beyond read:user.
      oauth_timeout_seconds: 900
      model_cache_ttl_seconds: 60 # 30-60 seconds, never stale fallback.
      token_expiry_buffer_seconds: 300
      model_picker_required: false # When false (default), discovers all active chat models even if model_picker_enabled is false upstream.
      allow_raw_model_names: false # When true, additionally exposes unprefixed model names (e.g. gpt-4o alongside copilot/gpt-4o).

# GHE.com alternative: replace the three public endpoints above with these.
# Use a client ID approved for device flow on your tenant (not a client secret).
# github_base_url: https://example.ghe.com
# github_api_url: https://api.example.ghe.com
# copilot_api_url: https://copilot-api.example.ghe.com
# github_client_id: YOUR_TENANT_DEVICE_FLOW_CLIENT_ID
# The two API URLs may be omitted for tenant-derived defaults.
# Do not combine a tenant base URL with explicit public API overrides.
