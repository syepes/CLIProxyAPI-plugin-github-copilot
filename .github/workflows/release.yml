name: Package plugin-store release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-26.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - runner: macos-15
            goos: darwin
            goarch: arm64
          - runner: ubuntu-26.04
            goos: freebsd
            goarch: amd64
          - runner: windows-2025
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install GNU make
        if: matrix.goos == 'windows'
        shell: bash
        run: choco install make --no-progress -y
      - name: Validate version and platform
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION=0.1.1; fi
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)+$ ]]
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [[ '${{ matrix.goos }}' != freebsd ]]; then
            test "$(go env GOOS)/$(go env GOARCH)" = '${{ matrix.goos }}/${{ matrix.goarch }}'
          fi
      - run: make check
        shell: bash
      - name: Verify modules and scan reachable vulnerabilities
        shell: bash
        run: make audit
      - if: matrix.goos != 'freebsd'
        shell: bash
        run: make build VERSION="$VERSION" REPOSITORY='https://github.com/${{ github.repository }}'
      - name: Install FreeBSD cross-compilation tools
        if: matrix.goos == 'freebsd'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld binutils xz-utils
      - name: Cross-build FreeBSD AMD64 (no VM)
        if: matrix.goos == 'freebsd'
        env:
          REPOSITORY: https://github.com/${{ github.repository }}
        run: ./scripts/build-freebsd.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: plugin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/**/*.so
            dist/**/*.dylib
            dist/**/*.dll
          if-no-files-found: error

  native-integration:
    uses: ./.github/workflows/native-integration.yml

  package:
    needs: [build, native-integration]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # goreleaser's changelog needs the full commit history and tags.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: plugin-*
          path: dist
          merge-multiple: true
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: v2.18.2
          # On a version tag this publishes a draft GitHub Release (see
          # .goreleaser.yml release.draft); any other trigger only builds the
          # ZIPs and checksums under release/ for the workflow artifact below.
          # A single space, not '', is the "true" branch: GitHub Actions
          # treats '' as falsy, which would always fall through to the ||.
          args: >-
            release --clean
            ${{ startsWith(github.ref, 'refs/tags/') && ' ' || '--skip=publish --snapshot' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify complete plugin-store archives
        run: go run ./cmd/checkrelease -dir release
      - name: Generate plugin-store registry entry
        run: |
          jq -n \
            --arg author "${GITHUB_REPOSITORY%%/*}" \
            --arg repo "https://github.com/$GITHUB_REPOSITORY" \
            '{id: "github-copilot", name: "GitHub Copilot", description: "GitHub Copilot device login, strictly account-enabled models, three client protocols, and account management.", author: $author, repository: $repo, homepage: $repo, tags: ["Provider", "OAuth", "GitHub Copilot", "Management"]}' \
            > release/registry-entry.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: plugin-store-release
          path: |
            release/*.zip
            release/checksums.txt
            release/registry-entry.json
      - name: Attach registry entry to the draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release/registry-entry.json
