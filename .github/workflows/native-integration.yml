name: Verify native integration
on:
  workflow_call:
permissions:
  contents: read
jobs:
  native-integration:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check out unmodified CLIProxyAPI v8.0.79
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: router-for-me/CLIProxyAPI
          ref: 6faa8d20b2673404cff70a2f2d9537ae0d0e684d
          path: .host-ci
          persist-credentials: false
      - name: Build the pinned plugin-enabled host
        working-directory: .host-ci
        env:
          CGO_ENABLED: "1"
        run: |
          test "$(git rev-parse HEAD)" = 6faa8d20b2673404cff70a2f2d9537ae0d0e684d
          go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/cli-proxy-api" ./cmd/server
      - name: Verify native ABI and client wire protocols
        run: make integration CPA_BINARY="$RUNNER_TEMP/cli-proxy-api" REPOSITORY="https://github.com/$GITHUB_REPOSITORY"
